<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMING SOON &#8211; アライブマーケティング株式会社</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://use.fontawesome.com/releases/v5.0.6/css/all.css" rel="stylesheet">
  <style>
    @font-face {
      font-family: bebasneuebold;
      src: url('/font/BebasNeueBold.woff') format('woff');
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { overflow-x: hidden; }
    body {
      font-family: 'Noto Sans JP','Open Sans',Helvetica Neue,Sans-serif;
      margin: 0; padding: 0;
      background-color: #090909;
      color: #fff;
      letter-spacing: 2px;
      font-size: 14px;
      line-height: 1.7;
    }
    body * { font-weight: bold; }
    a { text-decoration: none; color: #fff; }
    h1,h2,h3,p { margin: 0; }

    header {
      position: fixed; top: 0; left: 0; z-index: 10;
      display: flex; width: 100vw; height: 120px;
      color: #fff; align-items: center;
      opacity: 0;
      animation: headerIn 1.4s ease forwards;
      transition: height .4s, background-color .4s;
    }
    header.background_header { height: 60px; background-color: rgba(9,9,9,.8); }
    header a { color: #fff; }
    .logo { font-family: bebasneuebold !important; padding: .5rem 0 0 1rem; font-size: 2.8rem; letter-spacing: -0.1em; flex-grow: 3; }
    .logo:first-letter { color: #46FFDD; }
    header .menu { margin: 0 1rem; padding-top: .3rem; font-family: bebasneuebold; font-size: 1.5rem; letter-spacing: .1rem; flex-grow: 1; border-bottom: 4px solid transparent; transition: border-color .4s; white-space: nowrap; }
    header .menu:hover { border-bottom: 4px solid #46FFDD; }
    .hamburger_menu { position: absolute; right: 10px; display: none; flex-direction: column; align-items: center; justify-content: space-between; width: 24px; height: 18px; }
    .hamburger_menu_line { width: 100%; height: 1.5px; background-color: #fff; transition: transform .3s ease-in-out, opacity .3s ease-in-out; }
    .hamburger_menu.active .hamburger_menu_line:nth-child(1) { transform-origin: bottom right; transform: rotate(-45deg); }
    .hamburger_menu.active .hamburger_menu_line:nth-child(2) { opacity: 0; }
    .hamburger_menu.active .hamburger_menu_line:nth-child(3) { transform-origin: top right; transform: rotate(45deg); }
    .hamburger_menu_content { position: fixed; display: none; top: 0; left: 0; z-index: 9; width: 100vw; height: 100vh; padding-top: 5rem; background-color: rgba(0,0,0,.9); justify-content: center; }
    .hamburger_menu_content ul { width: 70%; }
    .hamburger_menu_content li { padding: 1rem 0; font-family: bebasneuebold; font-size: 1.8rem; letter-spacing: .3rem; text-align: center; }
    .hamburger_menu_content li a { color: #fff; }
    @keyframes headerIn { 0% { clip-path: inset(0 0 0 100%); opacity: 0; } 100% { clip-path: inset(0); opacity: 1; } }

    .placeholder {
      display: flex; flex-direction: column;
      width: 100vw; height: 100vh;
      justify-content: center; align-items: center; text-align: center;
    }
    .placeholder h1 { font-family: bebasneuebold; font-size: 5rem; letter-spacing: .5rem; color: #46FFDD; }
    .placeholder p { margin-top: 1.5rem; opacity: .6; }
    .back_link { display: inline-block; margin-top: 2rem; font-family: bebasneuebold; font-size: 1.1rem; letter-spacing: .2rem; color: #46FFDD; border-bottom: 1px solid #46FFDD; padding-bottom: 4px; }

    @media (max-width: 768px) {
      header { height: 3.5rem; background-color: #444; }
      .logo { padding-top: 7px; background-color: #444; font-size: 2rem; }
      header .menu { display: none; }
      .hamburger_menu { display: flex; }
      header.background_header { height: 3.5rem !important; background-color: #444 !important; }
      .placeholder h1 { font-size: 3rem; }
    }
  </style>
</head>
<body>
  <header id="site_header">
    <div class="logo"><a href="/">ALIVE</a></div>
    <div class="menu"><a href="/services/">SERVICE</a></div>
    <div class="menu"><a href="/works/">WORKS</a></div>
    <div class="menu"><a href="/about/">ABOUT US</a></div>
    <div class="menu"><a href="/recruit/">RECRUIT</a></div>
    <div class="menu"><a href="/contact/">CONTACT</a></div>
    <div class="hamburger_menu" id="hamburger_menu">
      <div class="hamburger_menu_line"></div>
      <div class="hamburger_menu_line"></div>
      <div class="hamburger_menu_line"></div>
    </div>
  </header>
  <div class="hamburger_menu_content" id="hamburger_menu_content">
    <ul>
      <li><a href="/services/">SERVICE</a></li>
      <li><a href="/works/">WORKS</a></li>
      <li><a href="/about/">ABOUT US</a></li>
      <li><a href="/recruit/">RECRUIT</a></li>
      <li><a href="/contact/">CONTACT</a></li>
    </ul>
  </div>

  <div class="placeholder">
    <h1>COMING SOON</h1>
    <p>このページは近日公開予定です。</p>
    <a href="/works/" class="back_link">← BACK TO WORKS</a>
  </div>

  <script>
    const hamburger = document.getElementById('hamburger_menu');
    const menu = document.getElementById('hamburger_menu_content');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    });
    window.addEventListener('scroll', () => {
      const header = document.getElementById('site_header');
      if (window.scrollY > 50) { header.classList.add('background_header'); }
      else { header.classList.remove('background_header'); }
    });
  </script>
</body>
</html>
